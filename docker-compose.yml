services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blackops
      POSTGRES_USER: blackops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno}
    volumes:
      - blackops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackops -d blackops"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://blackops:${POSTGRES_PASSWORD}@db:5432/blackops
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_BACKUP: ${GEMINI_API_KEY_BACKUP:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      OWNER_WHATSAPP_NUMBER: ${OWNER_WHATSAPP_NUMBER:-}
      OWNER_ALERTS_ENABLED: ${OWNER_ALERTS_ENABLED:-false}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-America/Bogota}
      OWNER_REPORTS_ENABLED: ${OWNER_REPORTS_ENABLED:-false}
      OWNER_DAILY_REPORT_TIME: ${OWNER_DAILY_REPORT_TIME:-08:00}
      OWNER_WEEKLY_REPORT_TIME: ${OWNER_WEEKLY_REPORT_TIME:-08:15}
      BLACKOPS_PUBLIC_API_BASE_URL: ${BLACKOPS_PUBLIC_API_BASE_URL:-}
      BLACKOPS_API_ENABLED: ${BLACKOPS_API_ENABLED:-false}
      WEBSITE_MONITOR_URL: ${WEBSITE_MONITOR_URL:-}
      WEBSITE_MONITOR_INTERVAL_MS: ${WEBSITE_MONITOR_INTERVAL_MS:-300000}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  blackops_pgdata:
